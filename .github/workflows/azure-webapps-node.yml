name: Build and Deploy Backend to Azure Web App

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/azure-webapps-node.yml"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: gym-track-api
  AZURE_WEBAPP_PACKAGE_PATH: "backend"
  NODE_VERSION: "22.x"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify Prisma Client
        run: |
          echo "=== Prisma generated files ==="
          find node_modules/.prisma -maxdepth 4 -type f | sort
          echo "=== Prisma Client ==="
          find node_modules/@prisma/client -maxdepth 2 -type f | sort | head -50

      - name: Build NestJS Application
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Verify production Prisma Client
        run: |
          echo "=== Prisma after prune ==="
          ls -la node_modules/.prisma/client
          test -f node_modules/.prisma/client/default.js || exit 1

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            backend/dist
            backend/node_modules
            backend/prisma
            backend/package.json
            backend/cleaned-exercises.json

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: backend

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}