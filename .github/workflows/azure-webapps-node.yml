name: Build and Deploy Backend to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/azure-webapps-node.yml"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: gym-track-api
  NODE_VERSION: "22.x"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: |
          echo "========== PRISMA GENERATE =========="
          npx prisma generate

          echo
          echo "========== PRISMA CLIENT =========="
          ls -la node_modules/.prisma/client

          echo
          echo "========== DEFAULT.JS =========="
          test -f node_modules/.prisma/client/default.js
          ls -l node_modules/.prisma/client/default.js

      - name: Build NestJS Application
        working-directory: backend
        run: |
          echo "========== NEST BUILD =========="
          npm run build

          echo
          echo "========== BUILD OUTPUT =========="
          find dist -maxdepth 4 -type f | sort

          echo
          echo "========== MAIN.JS =========="
          test -f dist/src/main.js
          ls -l dist/src/main.js

      - name: Prepare deployment package
        run: |
          echo "========== PREPARING DEPLOYMENT PACKAGE =========="

          rm -rf deploy
          mkdir -p deploy

          cp -r backend/dist deploy/dist
          cp -r backend/node_modules deploy/node_modules
          cp -r backend/prisma deploy/prisma
          cp backend/package.json deploy/package.json
          cp backend/package-lock.json deploy/package-lock.json

          if [ -f backend/cleaned-exercises.json ]; then
            cp backend/cleaned-exercises.json deploy/cleaned-exercises.json
          fi

      - name: Verify deployment package
        run: |
          echo "========== DEPLOYMENT ROOT =========="
          ls -la deploy

          echo
          echo "========== MAIN.JS =========="
          test -f deploy/dist/src/main.js
          ls -l deploy/dist/src/main.js

          echo
          echo "========== NESTJS =========="
          test -d deploy/node_modules/@nestjs/core
          echo "@nestjs/core exists"

          echo
          echo "========== PRISMA =========="
          test -d deploy/node_modules/.prisma/client
          echo ".prisma/client exists"

          echo
          echo "========== PRISMA DEFAULT =========="
          test -f deploy/node_modules/.prisma/client/default.js
          ls -l deploy/node_modules/.prisma/client/default.js

          echo
          echo "========== FINAL PACKAGE =========="
          du -sh deploy
          echo "Deployment package is ready."

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: Production

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Verify downloaded artifact
        run: |
          echo "========== DOWNLOADED ARTIFACT =========="

          echo
          echo "========== ROOT =========="
          ls -la deploy

          echo
          echo "========== MAIN.JS =========="
          test -f deploy/dist/src/main.js
          ls -l deploy/dist/src/main.js

          echo
          echo "========== NESTJS =========="
          test -d deploy/node_modules/@nestjs/core
          echo "@nestjs/core exists"

          echo
          echo "========== PRISMA =========="
          test -d deploy/node_modules/.prisma/client
          echo ".prisma/client exists"

          echo
          echo "========== PRISMA DEFAULT =========="
          test -f deploy/node_modules/.prisma/client/default.js
          ls -l deploy/node_modules/.prisma/client/default.js

          echo
          echo "All required files exist."

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy