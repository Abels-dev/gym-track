name: Build and Deploy Backend to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/azure-webapps-node.yml"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: gym-track-api
  NODE_VERSION: "22.x"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Build NestJS
        working-directory: backend
        run: npm run build

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir deploy

          cp -r backend/dist deploy/dist
          cp -r backend/node_modules deploy/node_modules
          cp -r backend/prisma deploy/prisma
          cp backend/package.json deploy/package.json
          cp backend/package-lock.json deploy/package-lock.json

          if [ -f backend/prisma.config.ts ]; then
            cp backend/prisma.config.ts deploy/prisma.config.ts
          fi

          if [ -f backend/cleaned-exercises.json ]; then
            cp backend/cleaned-exercises.json deploy/cleaned-exercises.json
          fi

      - name: Verify deployment package
        run: |
          test -f deploy/dist/src/main.js
          test -f deploy/package.json
          test -f deploy/package-lock.json
          test -d deploy/node_modules/@nestjs/core
          test -d deploy/node_modules/.prisma/client
          test -f deploy/node_modules/.prisma/client/default.js || test -f deploy/node_modules/.prisma/client/index.js

          echo "===== DEPLOYMENT PACKAGE ====="
          find deploy -maxdepth 3 -type d | sort

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: Production

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy