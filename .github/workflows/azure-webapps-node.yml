deploy:
  runs-on: ubuntu-latest
  needs: build

  environment:
    name: Production

  steps:
    - name: Download deployment artifact
      uses: actions/download-artifact@v4
      with:
        name: node-app
        path: deploy

    - name: Verify deployment package
      run: |
        echo "=== DEPLOYMENT ROOT ==="
        ls -la deploy

        echo "=== MAIN.JS ==="
        find deploy -name "main.js" -type f

        echo "=== PRISMA FILES ==="
        find deploy/node_modules -maxdepth 5 -iname "*prisma*" -type f | head -100

        test -f deploy/dist/src/main.js

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: deploy